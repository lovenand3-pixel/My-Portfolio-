
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Galaxy Battle</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#020510;color:white;font-family:Arial;overflow:hidden}
canvas{display:block}
#ui{
 position:absolute;top:15px;left:15px;right:15px;
 display:flex;justify-content:space-between;
 flex-wrap:wrap;gap:10px;font-size:18px;
 text-shadow:0 0 10px cyan;pointer-events:none
}
#bossUI{
 position:absolute;top:60px;left:20%;width:60%;
 display:none;text-align:center
}
#bossBar{
 width:100%;height:18px;background:#333;
 border:2px solid white;border-radius:10px;overflow:hidden
}
#bossFill{height:100%;width:100%;background:#ff1744}
#overlay{
 position:absolute;inset:0;display:flex;
 align-items:center;justify-content:center;
 background:rgba(1,3,15,.8);text-align:center
}
.panel{
 padding:30px;border:1px solid #16e0ff;
 background:rgba(5,15,40,.9);border-radius:20px;
 box-shadow:0 0 30px #00bfff44
}
h1{color:#52e9ff;font-size:40px;margin-bottom:15px}
button{
 margin-top:20px;padding:14px 32px;
 border:none;border-radius:10px;background:#00cfff;
 color:#031020;font-size:18px;font-weight:bold;cursor:pointer
}
p{line-height:1.8;color:#d0eaff}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="ui">
 <div>🚀 GALAXY BATTLE</div>
 <div id="stats">Score: 0 | HP: 100 | Level: 1</div>
</div>

<div id="bossUI">
 <div id="bossName">BOSS</div>
 <div id="bossBar"><div id="bossFill"></div></div>
</div>

<div id="overlay">
 <div class="panel">
 <h1>GALAXY BATTLE</h1>
 <p>Survive the cosmic battlefield!</p>
 <p>WASD / Arrow Keys = Move</p>
 <p>SPACE = Shoot | SHIFT = Boost</p>
 <p>6 Enemies + 1 Boss Every Level</p>
 <button onclick="startGame()">START GAME</button>
 </div>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const overlay=document.getElementById("overlay");
const bossUI=document.getElementById("bossUI");
const bossFill=document.getElementById("bossFill");

let W,H,player,stars,bullets,enemies,particles,boss,bossBullets;
let score,health,level,running,keys,spawnTimer,killCount;
let shootDelay=0,levelMessage=0;

function resize(){
 W=canvas.width=innerWidth;
 H=canvas.height=innerHeight;
}
window.addEventListener("resize",resize);
resize();

function starfield(){
 stars=Array.from({length:220},()=>({
 x:Math.random()*W,y:Math.random()*H,
 s:Math.random()*2+.3,speed:Math.random()*2+.5
 }));
}

function startGame(){
 overlay.style.display="none";
 score=0;health=100;level=1;killCount=0;
 bullets=[];enemies=[];particles=[];boss=null;bossBullets=[];
 keys={};spawnTimer=0;running=true;shootDelay=0;
 player={x:W/2,y:H-100,r:18,speed:5};
 starfield();
 bossUI.style.display="none";
 requestAnimationFrame(loop);
}

window.addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
 if([" ","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key))
 e.preventDefault();
});
window.addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

function shoot(){
 bullets.push({x:player.x,y:player.y-22,v:9});
}

function createEnemy(){
 enemies.push({
 x:Math.random()*(W-50)+25,y:-30,
 r:Math.random()*10+14,
 speed:1.5+level*.15
 });
}

function spawnBoss(){
 boss={
 x:W/2,y:110,w:100,h:65,
 hp:100+level*40,
 maxHp:100+level*40,
 speed:2+level*.3,dir:1,shootTimer:0
 };
 bossUI.style.display="block";
 document.getElementById("bossName").textContent="LEVEL "+level+" BOSS";
}

function explode(x,y,color){
 for(let i=0;i<18;i++){
 let a=Math.random()*Math.PI*2;
 let s=Math.random()*4+1;
 particles.push({
 x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
 life:35,color
 });
 }
}

function nextLevel(){
 level++;
 killCount=0;
 boss=null;
 enemies=[];
 bullets=[];
 bossBullets=[];
 bossUI.style.display="none";
 levelMessage=100;
}

function update(){
 let speed=player.speed;
 if(keys["shift"])speed*=1.7;
 if(keys["w"]||keys["arrowup"])player.y-=speed;
 if(keys["s"]||keys["arrowdown"])player.y+=speed;
 if(keys["a"]||keys["arrowleft"])player.x-=speed;
 if(keys["d"]||keys["arrowright"])player.x+=speed;

 player.x=Math.max(20,Math.min(W-20,player.x));
 player.y=Math.max(30,Math.min(H-30,player.y));

 shootDelay--;
 if(keys[" "]&&shootDelay<=0){
 shoot();shootDelay=10;
 }

 bullets.forEach(b=>b.y-=b.v);
 bullets=bullets.filter(b=>b.y>-20);

 // 6 ENEMIES PER LEVEL - FASTER SPAWNING
 if(!boss && killCount<6){
 spawnTimer++;
 if(spawnTimer>90){
 createEnemy();spawnTimer=0;
 }
 }

 enemies.forEach(e=>{
 e.y+=e.speed;
 e.x+=Math.sin(e.y*.025)*1.2;
 if(e.y>H+40){
 e.y=-20;health-=5;
 }
 if(Math.hypot(e.x-player.x,e.y-player.y)<e.r+player.r){
 explode(player.x,player.y,"#00ffff");
 e.y=-100;health-=10;
 }
 });

 bullets.forEach(b=>{
 enemies.forEach(e=>{
 if(Math.hypot(b.x-e.x,b.y-e.y)<e.r+5){
 b.y=-999;e.y=-999;
 score+=10;killCount++;
 explode(e.x,e.y,"#ff4da6");
 }
 });
 });
 enemies=enemies.filter(e=>e.y>-100);

 // BOSS AFTER 6 ENEMIES
 if(!boss && killCount>=6){
 spawnBoss();
 }

 if(boss){
 boss.x+=boss.speed*boss.dir;
 if(boss.x>W-boss.w/2||boss.x<boss.w/2)
 boss.dir*=-1;

 boss.shootTimer++;
 if(boss.shootTimer>65){
 bossBullets.push({
 x:boss.x,y:boss.y+30,v:3+level*.2
 });
 boss.shootTimer=0;
 }

 bullets.forEach(b=>{
 if(Math.abs(b.x-boss.x)<boss.w/2 &&
 Math.abs(b.y-boss.y)<boss.h/2){
 b.y=-999;
 boss.hp-=5;
 explode(b.x,b.y,"#ffb300");
 }
 });

 bossBullets.forEach(b=>{
 b.y+=b.v;
 if(Math.hypot(b.x-player.x,b.y-player.y)<player.r+8){
 b.y=H+100;health-=8;
 explode(player.x,player.y,"#00ffff");
 }
 });
 bossBullets=bossBullets.filter(b=>b.y<H+50);

 bossFill.style.width=Math.max(0,boss.hp/boss.maxHp*100)+"%";

 if(boss.hp<=0){
 explode(boss.x,boss.y,"#ff00ff");
 score+=100;
 nextLevel();
 }
 }

 particles.forEach(p=>{
 p.x+=p.vx;p.y+=p.vy;p.life--;
 });
 particles=particles.filter(p=>p.life>0);

 stars.forEach(s=>{
 s.y+=s.speed*(keys["shift"]?2:1);
 if(s.y>H){s.y=0;s.x=Math.random()*W;}
 });

 if(levelMessage>0)levelMessage--;
 if(health<=0)endGame();

 document.getElementById("stats").textContent=
 "Score: "+score+" | HP: "+Math.max(0,health)+" | Level: "+level;
}

function draw(){
 ctx.clearRect(0,0,W,H);
 ctx.fillStyle="#020510";
 ctx.fillRect(0,0,W,H);

 stars.forEach(s=>{
 ctx.fillStyle="rgba(160,220,255,"+(.3+s.s*.3)+")";
 ctx.fillRect(s.x,s.y,s.s,s.s);
 });

 let g=ctx.createRadialGradient(W*.5,H*.4,20,W*.5,H*.4,W*.55);
 g.addColorStop(0,"rgba(40,30,120,.15)");
 g.addColorStop(1,"rgba(0,0,0,0)");
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

 // PLAYER SHIP
 if(player){
 ctx.save();ctx.translate(player.x,player.y);
 ctx.shadowBlur=25;ctx.shadowColor="#00ffff";
 ctx.fillStyle="#00eaff";
 ctx.beginPath();
 ctx.moveTo(0,-25);ctx.lineTo(18,18);
 ctx.lineTo(0,9);ctx.lineTo(-18,18);
 ctx.closePath();ctx.fill();
 ctx.fillStyle="white";
 ctx.beginPath();ctx.arc(0,-5,5,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#ff8a00";
 ctx.beginPath();ctx.moveTo(-6,15);
 ctx.lineTo(0,28+Math.random()*8);
 ctx.lineTo(6,15);ctx.fill();
 ctx.restore();
 }

 // PLAYER BULLETS
 bullets.forEach(b=>{
 ctx.shadowBlur=15;ctx.shadowColor="#00ffff";
 ctx.fillStyle="#9effff";
 ctx.fillRect(b.x-2,b.y-8,4,14);
 ctx.shadowBlur=0;
 });

 // ENEMY SHIPS
 enemies.forEach(e=>{
 ctx.save();ctx.translate(e.x,e.y);
 ctx.shadowBlur=18;ctx.shadowColor="#ff2f70";
 ctx.fillStyle="#ff2f70";
 ctx.beginPath();
 ctx.moveTo(-e.r,-e.r/2);
 ctx.lineTo(0,e.r);
 ctx.lineTo(e.r,-e.r/2);
 ctx.lineTo(e.r/2,-e.r/2);
 ctx.lineTo(0,-e.r);
 ctx.lineTo(-e.r/2,-e.r/2);
 ctx.closePath();ctx.fill();
 ctx.restore();
 });

 // BOSS SHIP
 if(boss){
 ctx.save();ctx.translate(boss.x,boss.y);
 ctx.shadowBlur=35;ctx.shadowColor="#ff003c";
 ctx.fillStyle="#9e0033";
 ctx.beginPath();
 ctx.moveTo(-50,-25);ctx.lineTo(-25,-45);
 ctx.lineTo(25,-45);ctx.lineTo(50,-25);
 ctx.lineTo(40,30);ctx.lineTo(20,20);
 ctx.lineTo(0,45);ctx.lineTo(-20,20);
 ctx.lineTo(-40,30);ctx.closePath();ctx.fill();
 ctx.fillStyle="#ff4444";
 ctx.fillRect(-35,-10,20,12);
 ctx.fillRect(15,-10,20,12);
 ctx.fillStyle="#ffcc00";
 ctx.beginPath();ctx.arc(0,10,10,0,Math.PI*2);ctx.fill();
 ctx.restore();
 }

 // BOSS BULLETS
 bossBullets.forEach(b=>{
 ctx.shadowBlur=15;ctx.shadowColor="#ff1744";
 ctx.fillStyle="#ff5555";
 ctx.beginPath();ctx.arc(b.x,b.y,8,0,Math.PI*2);ctx.fill();
 ctx.shadowBlur=0;
 });

 // EXPLOSIONS
 particles.forEach(p=>{
 ctx.globalAlpha=p.life/35;
 ctx.fillStyle=p.color;
 ctx.fillRect(p.x,p.y,4,4);
 });
 ctx.globalAlpha=1;

 if(levelMessage>0){
 ctx.textAlign="center";
 ctx.font="bold 42px Arial";
 ctx.fillStyle="#00ffff";
 ctx.shadowBlur=20;ctx.shadowColor="cyan";
 ctx.fillText("LEVEL "+level,W/2,H/2);
 ctx.shadowBlur=0;
 }
}

function loop(){
 if(!running)return;
 update();draw();
 requestAnimationFrame(loop);
}

function endGame(){
 running=false;
 bossUI.style.display="none";
 overlay.style.display="flex";
 document.querySelector(".panel").innerHTML=`
 <h1>GAME OVER</h1>
 <p>Your Score: ${score}</p>
 <p>Level Reached: ${level}</p>
 <button onclick="startGame()">PLAY AGAIN</button>`;
}
</script>
</body>
</html>
